# pull_request_target with the base branch's code only, and a pull_request workflow (unprivileged) that may check out the head.
on:
  pull_request_target:
jobs:
  label:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
